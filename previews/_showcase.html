<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles.css">
<style>.grid{display:grid;grid-template-columns:1fr 1fr;gap:0} .pane{padding:16px} .l{background:var(--ds-bg-app)}</style></head>
<body><div class="grid">
  <div class="pane l" data-theme="light">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="ds-btn ds-btn--primary ds-btn--sm"><span class="ds-btn__label">Провести</span></button>
      <span class="ds-badge ds-badge--success">Проведён</span></div>
    <input class="ds-input ds-input--sm" value="Light theme"></div>
  <div class="pane l" data-theme="dark">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="ds-btn ds-btn--primary ds-btn--sm"><span class="ds-btn__label">Провести</span></button>
      <span class="ds-badge ds-badge--success">Проведён</span></div>
    <input class="ds-input ds-input--sm" value="Dark theme"></div>
</div></body></html>

<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles.css"></head>
<body><div style="padding:16px;height:280px">
<div class="ds-field"><label class="ds-field__label" id="cb-label" for="cb-trigger">Валюта</label>
  <div class="ds-combobox ds-combobox--md">
    <button type="button" id="cb-trigger" class="ds-combobox__trigger" aria-labelledby="cb-label cb-value" aria-expanded="true">
      <span class="ds-combobox__icon">₽</span><span id="cb-value" class="ds-combobox__value">Рубль</span><svg class="ds-caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div class="ds-combobox__popover">
      <input class="ds-combobox__search ds-input ds-input--sm" value="">
      <ul class="ds-combobox__list" role="listbox">
        <li class="ds-combobox__option is-active is-selected" role="option"><span class="ds-combobox__icon">₽</span><span>Рубль</span></li>
        <li class="ds-combobox__option" role="option"><span class="ds-combobox__icon">$</span><span>Доллар США</span></li>
        <li class="ds-combobox__option" role="option"><span class="ds-combobox__icon">€</span><span>Евро</span></li>
      </ul>
    </div>
  </div>
</div></div></body></html>

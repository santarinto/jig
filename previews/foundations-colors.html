<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles.css">
<style>
  .wrap { padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw { width: 96px; border: 1px solid var(--ds-border); border-radius: var(--ds-radius); overflow: hidden; font-size: var(--ds-fs-sm); }
  .sw .chip { height: 40px; }
  .sw .lbl { padding: 4px 6px; background: var(--ds-surface); color: var(--ds-text-secondary); }
</style></head>
<body><div class="wrap"><div class="row">
  <div class="sw"><div class="chip" style="background:var(--ds-accent)"></div><div class="lbl">accent</div></div>
  <div class="sw"><div class="chip" style="background:var(--ds-bg-app)"></div><div class="lbl">bg-app</div></div>
  <div class="sw"><div class="chip" style="background:var(--ds-surface)"></div><div class="lbl">surface</div></div>
  <div class="sw"><div class="chip" style="background:var(--ds-section-bar)"></div><div class="lbl">section-bar</div></div>
  <div class="sw"><div class="chip" style="background:var(--ds-success)"></div><div class="lbl">success</div></div>
  <div class="sw"><div class="chip" style="background:var(--ds-warning)"></div><div class="lbl">warning</div></div>
  <div class="sw"><div class="chip" style="background:var(--ds-error)"></div><div class="lbl">error</div></div>
  <div class="sw"><div class="chip" style="background:var(--ds-info)"></div><div class="lbl">info</div></div>
</div></div></body></html>

<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles.css"></head>
<body><div style="padding:16px;display:flex;gap:16px;flex-wrap:wrap">
  <div class="ds-field"><label class="ds-field__label" for="tf-name">Наименование</label>
    <input id="tf-name" class="ds-input ds-input--md" value="ООО «Ромашка»"></div>
  <div class="ds-field"><label class="ds-field__label" for="tf-code">Код</label>
    <input id="tf-code" class="ds-input ds-input--md" placeholder="000000001" aria-describedby="tf-code-hint">
    <span id="tf-code-hint" class="ds-field__hint">До 9 символов</span></div>
  <div class="ds-field"><label class="ds-field__label" for="tf-inn">ИНН</label>
    <input id="tf-inn" class="ds-input ds-input--md is-error" value="77" aria-invalid="true" aria-describedby="tf-inn-err">
    <span id="tf-inn-err" class="ds-field__error">Обязательное поле</span></div>
</div></body></html>

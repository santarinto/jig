<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles.css"></head>
<body><div style="padding:16px;max-width:520px">

    <div class="ds-accordion__item">

      </button>
    </div>
    <div class="ds-accordion__item">
      <button type="button" class="ds-accordion__header" aria-expanded="false" aria-controls="ac-3-panel" id="ac-3-header">
        <span class="ds-accordion__title">Контактные лица</span>
        <svg class="ds-caret ds-caret--panel" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>

    </div>
  </div>

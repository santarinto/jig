<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles.css"></head>
<body><div style="padding:16px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap">
  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="ds-toast ds-toast--success" role="status"><span class="ds-toast__msg">Документ проведён</span><button class="ds-toast__close" aria-label="Закрыть">×</button></div>
    <div class="ds-toast ds-toast--error" role="status"><span class="ds-toast__msg">Не удалось провести: нет остатка</span><button class="ds-toast__close" aria-label="Закрыть">×</button></div>
  </div>
  <div class="ds-notifs" role="log" aria-label="Центр оповещений">
    <div class="ds-notifs__item ds-notifs__item--info"><div class="ds-notifs__body"><div class="ds-notifs__title">Обновление</div><div class="ds-notifs__text">Доступна новая версия конфигурации</div></div><button class="ds-notifs__dismiss" aria-label="Скрыть">×</button></div>
    <div class="ds-notifs__item ds-notifs__item--warning"><div class="ds-notifs__body"><div class="ds-notifs__title">Срок сдачи отчёта</div><div class="ds-notifs__text">НДС за квартал — до 25 июля</div></div><button class="ds-notifs__dismiss" aria-label="Скрыть">×</button></div>
    <div class="ds-notifs__item ds-notifs__item--success"><div class="ds-notifs__body"><div class="ds-notifs__title">Синхронизация завершена</div></div><button class="ds-notifs__dismiss" aria-label="Скрыть">×</button></div>
  </div>
</div></body></html>

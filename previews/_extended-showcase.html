<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles.css">
<style>.grid{display:grid;grid-template-columns:1fr 1fr} .pane{padding:16px;background:var(--ds-bg-app)}</style></head>
<body><div class="grid">
  <div class="pane" data-theme="light">
    <div class="ds-toast ds-toast--success" role="status"><span class="ds-toast__msg">Проведено — light</span></div>
    <div style="margin-top:12px"><span class="ds-badge ds-badge--info">Новый</span></div>
  </div>
  <div class="pane" data-theme="dark">
    <div class="ds-toast ds-toast--success" role="status"><span class="ds-toast__msg">Проведено — dark</span></div>
    <div style="margin-top:12px"><span class="ds-badge ds-badge--info">Новый</span></div>
  </div>
</div></body></html>

<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles.css">
<style>.stage{position:relative;height:260px;background:var(--ds-bg-app)}
.ds-modal__overlay{position:absolute}</style></head>
<body><div class="stage">
  <div class="ds-modal__overlay">
    <div class="ds-modal" role="dialog" aria-modal="true">
      <div class="ds-modal__header"><span class="ds-modal__title">Подтверждение</span><button class="ds-modal__close" aria-label="Закрыть">×</button></div>
      <div class="ds-modal__body">Удалить документ «Реализация №1»? Действие необратимо.</div>
      <div class="ds-modal__footer">
        <button class="ds-btn ds-btn--ghost ds-btn--md"><span class="ds-btn__label">Отмена</span></button>
        <button class="ds-btn ds-btn--danger ds-btn--md"><span class="ds-btn__label">Удалить</span></button>
      </div>
    </div>
  </div>
</div></body></html>

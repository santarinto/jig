<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles.css"></head>
<body>
<header class="ds-appbar">
  <div class="ds-appbar__brand">Курьер 7</div>
  <div class="ds-appbar__center"><div class="ds-appbar__centerbox"><input class="ds-input ds-input--sm" placeholder="Поиск везде (Ctrl+Shift+F)" style="width:320px"></div></div>
  <div class="ds-appbar__actions">
    <!-- Колокольчик со счётчиком и инициалы — не действия, а хвост `trailing`:
         в «Ещё» они не сворачиваются (DS-306). Пустой ряд действий и
         холостая «Ещё» в модели опущены: оба вне потока. -->
    <span class="ds-appbar__trailing" data-ds-trailing="">
      <button class="ds-btn ds-btn--ghost ds-btn--sm"><span class="ds-btn__label">🔔</span></button>
      <span class="ds-badge ds-badge--accent">ИП</span>
    </span>
  </div>
</header></body></html>

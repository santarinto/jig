<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles.css"></head>
<body><div style="padding:16px;max-width:720px;display:flex;flex-direction:column;gap:12px">
  <div class="ds-cmdbar" role="toolbar">
    <div class="ds-cmdbar__row">
      <button type="button" class="ds-btn ds-btn--primary ds-btn--sm"><span class="ds-btn__label">Провести и закрыть</span></button>
      <button type="button" class="ds-btn ds-btn--secondary ds-btn--sm"><span class="ds-btn__label">Записать</span></button>
      <span class="ds-cmdbar__sep"></span>
      <button type="button" class="ds-btn ds-btn--ghost ds-btn--sm"><span class="ds-btn__label">Печать</span></button>
    </div>
    <div class="ds-cmdbar__more is-idle"><div class="ds-dropdown"><button type="button" class="ds-btn ds-btn--ghost ds-btn--sm ds-dropdown__trigger" aria-haspopup="menu" aria-expanded="false"><span class="ds-btn__label">Ещё</span></button></div></div>
    <span class="ds-cmdbar__trailing" data-ds-trailing=""><span class="ds-badge ds-badge--warning">Не проведён</span></span>
  </div>
  <div class="ds-card">
    <div class="ds-card__header">Реализация товаров №РТ-0001 от 24.07.2026</div>
    <div class="ds-card__body">
      <div class="ds-formrow"><label class="ds-formrow__label">Организация</label><div class="ds-formrow__control"><span class="ds-select-wrap"><select class="ds-select ds-select--md"><option>ООО «Ромашка»</option></select><span class="ds-select__chevron">▾</span></span></div></div>
      <div class="ds-formrow"><label class="ds-formrow__label">Контрагент</label><div class="ds-formrow__control"><input class="ds-input ds-input--md" value="ООО «Покупатель»"></div></div>
      <table class="ds-table">
        <thead><tr><th>Номенклатура</th><th class="ds-table__num">Кол-во</th><th class="ds-table__num">Цена</th><th class="ds-table__num">Сумма</th></tr></thead>
        <tbody>
          <tr><td>Ноутбук ASUS</td><td class="ds-table__num">2</td><td class="ds-table__num">54 900,00</td><td class="ds-table__num">109 800,00</td></tr>
          <tr><td>Мышь Logitech</td><td class="ds-table__num">5</td><td class="ds-table__num">1 290,00</td><td class="ds-table__num">6 450,00</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div></body></html>

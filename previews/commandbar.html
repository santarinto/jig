<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/styles.css"></head>
<body><div style="padding:0">
<div class="ds-cmdbar" role="toolbar">
  <div class="ds-cmdbar__row is-folded">
    <button class="ds-btn ds-btn--primary ds-btn--sm"><span class="ds-btn__label">Создать</span></button>
    <button class="ds-btn ds-btn--ghost ds-btn--sm"><span class="ds-btn__label">Скопировать</span></button>
    <span class="ds-cmdbar__sep"></span>
    <button class="ds-btn ds-btn--ghost ds-btn--sm"><span class="ds-btn__label">Обновить</span></button>
    <button class="ds-btn ds-btn--ghost ds-btn--sm"><span class="ds-btn__label">Печать</span></button>
    <button class="ds-btn ds-btn--ghost ds-btn--sm" data-ds-folded="true"><span class="ds-btn__label">Отменить проведение</span></button>
  </div>
  <div class="ds-cmdbar__more"><div class="ds-dropdown"><button type="button" class="ds-btn ds-btn--ghost ds-btn--sm ds-dropdown__trigger" aria-haspopup="menu" aria-expanded="false"><span class="ds-btn__label">Ещё</span></button></div></div>
  <span class="ds-cmdbar__trailing" data-ds-trailing=""><span class="ds-select-wrap"><input class="ds-input ds-input--sm" placeholder="Поиск (Ctrl+F)" style="width:180px"></span></span>
</div></div></body></html>

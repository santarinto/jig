# Поставка (JIG-28): на push тега `v*` собрать dist/, упаковать тарбол
# (prepack/postpack чистят devDependencies/scripts — scripts/strip-manifest.mjs,
# гейт dist-shipped) и приложить его к GitHub Release. Тег указывает на
# ИСХОДНЫЙ коммит выпуска (ветки delivery больше нет, см. docs/release.md) —
# сборка целиком идёт здесь, а не в момент релизного коммита.
#
# Версия Node: источник истины — .nvmrc в корне репозитория (JIG-5). До него
# источника не было вовсе — версию (26.x) брали по единственному косвенному
# сигналу, мажору devDependencies."@types/node" ("^26.1.1"), а не из явного
# решения. .github/workflows/ci.yml берёт версию тем же файлом.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - run: npm run build

      - name: dist-version — токен доехал до собранного
        run: node scripts/check-dist-version.mjs

      - name: dist-shipped — тарбол без devDependencies/scripts, состав корректен
        run: npx vitest run src/__guards__/dist-shipped.test.ts

      - name: npm pack
        run: npm run tarball

      - name: тело релиза из CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/print-changelog-section.mjs "$version" > /tmp/release-notes.md

      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" santarinto-jig-*.tgz \
            --notes-file /tmp/release-notes.md
